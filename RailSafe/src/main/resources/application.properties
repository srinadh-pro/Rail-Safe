# =========================================================
# RailSafe - default configuration (Aiven MySQL, TLS required)
# =========================================================
# Render injects PORT; local development keeps the historical 8080 default.
server.port=${PORT:${RAILSAFE_SERVER_PORT:8080}}
# Bind to loopback only when a TLS reverse proxy is in front (set the env to 127.0.0.1).
# Do NOT set this on Render: the platform routes to the container's 0.0.0.0:$PORT.
server.address=${RAILSAFE_SERVER_ADDRESS:0.0.0.0}
spring.application.name=RailSafe

# Production database: Aiven MySQL 8. The connection is encrypted and the
# server certificate is verified against the Aiven CA bundled in the jar as
# aiven-truststore.p12. All credentials are required environment variables;
# no secret is stored in this file. See deployment/railsafe.env.example.
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-e1e61fd-railsafe.j.aivencloud.com:17447/defaultdb?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=classpath:aiven-truststore.p12&trustCertificateKeyStoreType=PKCS12&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
# Passed as a driver property (not in the URL) so special characters in the
# rotated password do not break JDBC URL parameter parsing.
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${AIVEN_TRUSTSTORE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP settings. The Aiven free tier has a limited connection count.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# "update" lets Hibernate create/update the tables on first run. For production
# schema discipline, set RAILSAFE_DDL_AUTO=validate after confirming the schema
# matches the entities (or adopt versioned Flyway migrations). Never use
# "create"/"create-drop" against the live database.
# database/railsafe_schema.sql is provided for manual setup.
spring.jpa.hibernate.ddl-auto=${RAILSAFE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Hibernate 6 detects the MySQL dialect from JDBC metadata; setting it explicitly
# is deprecated (HHH90000025). Verified against Aiven MySQL 8.0.
spring.jpa.properties.hibernate.format_sql=true
# Store Java enums as VARCHAR instead of database-native ENUM types. This keeps
# new notification/event values portable across H2, MySQL and Oracle, and avoids
# H2 rejecting a new value that was not in the original enum definition.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
# Keep @Lob String fields as LONGTEXT/CLOB rather than MySQL TINYTEXT (255 bytes).
spring.jpa.properties.hibernate.type.preferred_clob_jdbc_type=LONGVARCHAR

# A gate whose last update is older than this is displayed as UNKNOWN.
railsafe.gate.stale-minutes=120

# Session-based authentication (cookie JSESSIONID). JSON APIs remain same-origin.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure cookies + HSTS are off for local HTTP development. Enable both when the
# app is served over HTTPS (see deployment/nginx-railsafe.conf).
server.servlet.session.cookie.secure=${RAILSAFE_COOKIE_SECURE:false}
railsafe.security.hsts-enabled=${RAILSAFE_HSTS_ENABLED:false}
railsafe.security.hsts-max-age-seconds=${RAILSAFE_HSTS_MAX_AGE_SECONDS:31536000}
# Respect X-Forwarded-* from the trusted TLS-terminating reverse proxy so the
# login lockout sees the real client IP. "none" is correct for direct HTTP.
server.forward-headers-strategy=${RAILSAFE_FORWARD_HEADERS_STRATEGY:none}

# Login abuse control: after N failed attempts from one client IP, reject further
# attempts for the lock window before credentials reach the AuthenticationManager.
railsafe.security.login-max-attempts=${RAILSAFE_LOGIN_MAX_ATTEMPTS:10}
railsafe.security.login-lock-minutes=${RAILSAFE_LOGIN_LOCK_MINUTES:15}

server.error.include-message=never
logging.level.org.springframework.security=INFO
logging.level.com.railsafe=INFO

# Security is enforced on the initial request and on error dispatches. Long-lived
# SSE streams complete asynchronously after logout/session invalidation; applying
# the authorization filter again on that ASYNC dispatch produced noisy
# "response already committed" AccessDeniedException stack traces. The stream is
# still authenticated when it opens, so re-filtering the async completion adds no
# protection and only creates server-error noise.
spring.security.filter.dispatcher-types=request,error

# =========================================================
# ADDITIVE LIVE LAYER
# =========================================================
# The demo ships with the synthetic simulation provider enabled so the project
# works out of the box without any Indian Railways API. Everything it produces is
# labelled "SIMULATION MODE - NOT LIVE RAILWAY DATA" in the UI and API.
#
# To disable synthetic data and show "LIVE TRAIN DATA UNAVAILABLE" instead:
#   set RAILSAFE_LIVE_MODE=unavailable
#   (optionally set RAILSAFE_SYNTHETIC_DATA=false to skip seeding the demo rows)
# Modes: unavailable | http | simulation | railradar
#
# railradar uses the independent RailRadar API. It is NOT an official Indian
# Railways, IRCTC or NTES feed. To enable it:
#   set RAILSAFE_LIVE_MODE=railradar
#   set RAILSAFE_RAILRADAR_KEY=rg_...   (https://railradar.in/developers)
# The provider keeps its own monthly request budget and marks cached data stale
# instead of pretending it is current. The free RailRadar plan (100/month) is far
# too small for continuous tracking of ten trains; set the quota to your plan.
railsafe.live.provider-mode=${RAILSAFE_LIVE_MODE:simulation}
railsafe.live.provider-name=${RAILSAFE_LIVE_PROVIDER_NAME:Authorised railway feed}
railsafe.live.feed-url=${RAILSAFE_LIVE_FEED_URL:}
railsafe.live.feed-api-key=${RAILSAFE_LIVE_FEED_KEY:}
railsafe.live.feed-api-key-header=${RAILSAFE_LIVE_FEED_KEY_HEADER:X-API-Key}
railsafe.live.feed-timeout-seconds=8

# ---- RailRadar third-party provider (independent; not official IR/NTES) ----
# Train numbers are polled in rotation so one dashboard refresh costs at most one
# request. Separate multiple numbers with commas.
railsafe.live.railradar.base-url=${RAILSAFE_RAILRADAR_URL:https://api.railradar.in}
railsafe.live.railradar.api-key=${RAILSAFE_RAILRADAR_KEY:}
railsafe.live.railradar.train-numbers=${RAILSAFE_RAILRADAR_TRAINS:12702,12701,12760,12759,12727,12728,17011,17012,12713,12714}
# Minimum gap between requests. RailRadar's public limit is 10/minute.
railsafe.live.railradar.min-request-interval-seconds=${RAILSAFE_RAILRADAR_MIN_INTERVAL_SECONDS:8}
# Desired gap between polled trains. The monthly budget can make this longer.
railsafe.live.railradar.poll-interval-seconds=${RAILSAFE_RAILRADAR_POLL_SECONDS:10}
# Hard local monthly request budget. 0 disables the local cap (not recommended).
# Always set this to the real limit of your RailRadar plan.
railsafe.live.railradar.monthly-quota=${RAILSAFE_RAILRADAR_MONTHLY_QUOTA:100}
# Requests used on the first run so the dashboard starts with some data.
railsafe.live.railradar.initial-burst=${RAILSAFE_RAILRADAR_INITIAL_BURST:3}
# Persisted per-month usage so a restart cannot reset the budget.
railsafe.live.railradar.quota-file=${RAILSAFE_RAILRADAR_QUOTA_FILE:data/railradar-quota.json}
# Last successful positions, restored on startup so a restart does not spend quota.
railsafe.live.railradar.cache-file=${RAILSAFE_RAILRADAR_CACHE_FILE:data/railradar-cache.json}
railsafe.live.cache-seconds=20
railsafe.live.feed-stale-seconds=300
railsafe.live.match-radius-km=5.0
# How far ahead a train may be before it is hidden from a crossing. A 1-hour
# window suits frequent live polling. With a small monthly quota the refresh gap
# is hours, so set RAILSAFE_LOOKAHEAD_SECONDS to cover that gap (for example 43200
# for a 12-hour window); otherwise real trains will be filtered out as "too far".
railsafe.live.lookahead-seconds=${RAILSAFE_LOOKAHEAD_SECONDS:3600}
railsafe.live.near-gate-km=0.6
railsafe.live.near-gate-seconds=180
railsafe.live.crossing-window-seconds=120
railsafe.live.crossing-duration-seconds=240
railsafe.live.passed-window-seconds=120
railsafe.live.close-lead-seconds=180
railsafe.live.approach-alert-seconds=900
railsafe.live.closing-soon-seconds=300
railsafe.live.opening-soon-seconds=300
railsafe.live.alert-interval-millis=60000
railsafe.live.alert-initial-delay-millis=15000
railsafe.live.alerts-enabled=true

# Simulation is opt-in twice: provider-mode=simulation AND this flag=true.
# Both default to true for this demo build. Set either to false to disable it.
railsafe.live.simulation-acknowledged=${RAILSAFE_SIMULATION_ACKNOWLEDGED:true}
railsafe.live.simulation-notifications=${RAILSAFE_SIMULATION_NOTIFICATIONS:true}

# Synthetic demo dataset (20 crossings, 30 trains, 50 tracking rows, 30 history
# rows, 20 demo routes, 50 notifications). Seeding is idempotent.
railsafe.live.synthetic-data-enabled=${RAILSAFE_SYNTHETIC_DATA:true}

# Simulation timing parameters. A train's ETA is projected onto an absolute
# timestamp inside this repeating cycle, so countdowns survive page refreshes.
railsafe.live.simulation-cycle-seconds=${RAILSAFE_SIMULATION_CYCLE_SECONDS:1800}
# Extra safety buffer added after a train clears before the barrier is shown open.
railsafe.live.opening-buffer-seconds=${RAILSAFE_OPENING_BUFFER_SECONDS:60}
# If another train is due within this gap, the simulated barrier is not reopened.
railsafe.live.reopen-gap-seconds=${RAILSAFE_REOPEN_GAP_SECONDS:300}

# OSRM public demo server. Replace with your own OSRM instance for production use.
railsafe.live.osrm-base-url=${RAILSAFE_OSRM_URL:https://router.project-osrm.org}
railsafe.live.routing-timeout-seconds=10
railsafe.live.route-avoid-radius-meters=150
railsafe.live.route-detour-offset-meters=900
railsafe.live.route-max-alternatives=3
railsafe.live.route-cache-seconds=60

# Optional authorised gate-sensor webhook. Blank = endpoint disabled.
railsafe.live.sensor-api-key=${RAILSAFE_SENSOR_API_KEY:}
railsafe.live.snapshot-retention-hours=72

# Optional email/SMS delivery. Both are disabled by default.
# To enable email, also configure spring.mail.* (see README).
railsafe.notifications.email.enabled=${RAILSAFE_EMAIL_ENABLED:false}
railsafe.notifications.email.from=${RAILSAFE_EMAIL_FROM:no-reply@railsafe.local}
railsafe.notifications.sms.enabled=${RAILSAFE_SMS_ENABLED:false}
railsafe.notifications.sms.webhook-url=${RAILSAFE_SMS_WEBHOOK_URL:}
railsafe.notifications.sms.api-key=${RAILSAFE_SMS_API_KEY:}

# =========================================================
# Super Admin bootstrap (login-first access)
# Created once, only when no SUPER_ADMIN account exists. There is
# no public SUPER_ADMIN registration endpoint.
# The first SUPER_ADMIN is created only when none exists. Its password is a
# required environment variable; the existing account password was rotated
# separately in the database.
# =========================================================
railsafe.super-admin.email=${RAILSAFE_SUPER_ADMIN_EMAIL}
railsafe.super-admin.password=${RAILSAFE_SUPER_ADMIN_PASSWORD}

# Login-page demo shortcuts are off by default in production.
railsafe.demo.accounts-enabled=${RAILSAFE_DEMO_ACCOUNTS_ENABLED:false}

# Customer demo account. h2/dev profiles only; no production default.
railsafe.demo.customer.email=${RAILSAFE_DEMO_CUSTOMER_EMAIL:}
railsafe.demo.customer.password=${RAILSAFE_DEMO_CUSTOMER_PASSWORD:}

# =========================================================
# Restricted external source review
# =========================================================
# A startup importer retains the expanded dataset in a dedicated table so every
# row can be reviewed only by a SUPER_ADMIN. It is never used as operational data.
# The imported file must declare dataMode=SIMULATION, or the import is skipped.
railsafe.restricted-dataset.import-enabled=${RAILSAFE_RESTRICTED_DATASET_IMPORT:true}
railsafe.restricted-dataset.path=${RAILSAFE_RESTRICTED_DATASET_PATH:data/railsafe-expanded-data.json}
