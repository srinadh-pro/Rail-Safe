# RailSafe TLS-terminating reverse proxy sample.
#
# Place in /etc/nginx/sites-available/railsafe and enable it. Replace the
# server_name and certificate paths. The app itself keeps listening on 8080
# on localhost only (set RAILSAFE_SERVER_ADDRESS=127.0.0.1 in the env file).
#
# Pair this with these settings in deployment/railsafe.env.local:
#   RAILSAFE_COOKIE_SECURE=true
#   RAILSAFE_HSTS_ENABLED=true
#   RAILSAFE_FORWARD_HEADERS_STRATEGY=framework

server {
    listen 80;
    server_name railsafe.example.org;
    # Redirect all plaintext traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name railsafe.example.org;

    ssl_certificate     /etc/letsencrypt/live/railsafe.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/railsafe.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS. Only enable once you are certain HTTPS is permanent for this host.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # SSE streams (/api/live/stream) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection '';
    }
}
