# =========================================================
# OPTIONAL local/demo profile only (no production secrets)
# Start with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# =========================================================
spring.datasource.url=jdbc:h2:file:./data/railsafe-demo;MODE=Oracle;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# The default profile targets MySQL; local H2 needs its own dialect.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# =========================================================
# Demo-only bootstrap credentials (h2/dev profile)
# These values are never used by the default/production profile.
# The SUPER_ADMIN password is required from the environment; the
# shortcut credentials below are local demo values only.
# =========================================================
railsafe.super-admin.email=${RAILSAFE_SUPER_ADMIN_EMAIL:superadmin@railsafe.demo}
railsafe.super-admin.password=${RAILSAFE_SUPER_ADMIN_PASSWORD}
railsafe.demo.customer.email=${RAILSAFE_DEMO_CUSTOMER_EMAIL:customer@railsafe.demo}
railsafe.demo.customer.password=${RAILSAFE_DEMO_CUSTOMER_PASSWORD:Customer@123}
railsafe.demo.staff.password=${RAILSAFE_DEMO_STAFF_PASSWORD:Staff@123}
railsafe.demo.admin.password=${RAILSAFE_DEMO_ADMIN_PASSWORD:Admin@123}
railsafe.demo.super-admin.password=${RAILSAFE_DEMO_SUPER_ADMIN_PASSWORD:}
# Demo credential cards on the login page are available in this profile only.
railsafe.demo.accounts-enabled=true
