# =========================================================
# MySQL profile (Aiven MySQL, TLS required)
# =========================================================
# The default application.properties already targets Aiven MySQL. This profile
# is kept as an explicit alias so either of these works:
#   java -jar target/railsafe-1.0.0.jar
#   java -jar target/railsafe-1.0.0.jar --spring.profiles.active=mysql
#
# Credentials and the TLS truststore are defined in application.properties and
# can be overridden with DB_URL, DB_USERNAME and DB_PASSWORD.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
