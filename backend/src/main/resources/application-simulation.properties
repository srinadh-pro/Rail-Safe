# =========================================================
# EXPLICIT DEMONSTRATION PROFILE
# =========================================================
# Activate together with a database profile, for example:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2,simulation
#
# This is the ONLY way RailSafe generates train movements. Every payload is
# labelled "SIMULATION MODE - NOT LIVE RAILWAY DATA" and simulation snapshots are
# never written to the train_snapshots audit table.
# =========================================================
railsafe.live.provider-mode=simulation
railsafe.live.simulation-acknowledged=true

# Put simulation alerts in the notification history so the demo shows the full
# alert flow. Set RAILSAFE_SIMULATION_NOTIFICATIONS=false for a quiet run.
railsafe.live.simulation-notifications=${RAILSAFE_SIMULATION_NOTIFICATIONS:true}

# Synthetic demo timing parameters (same defaults as application.properties).
railsafe.live.synthetic-data-enabled=${RAILSAFE_SYNTHETIC_DATA:true}
railsafe.live.simulation-cycle-seconds=${RAILSAFE_SIMULATION_CYCLE_SECONDS:1800}
railsafe.live.opening-buffer-seconds=${RAILSAFE_OPENING_BUFFER_SECONDS:60}
railsafe.live.reopen-gap-seconds=${RAILSAFE_REOPEN_GAP_SECONDS:300}
