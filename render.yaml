# Render Blueprint for the RailSafe Spring Boot API.
# Deploy from GitHub: New > Blueprint > srinadh-pro/Rail-Safe > main.
# Secrets are prompted in the Render Dashboard (sync: false); never commit values.

services:
  - type: web
    name: railsafe-backend
    runtime: docker
    # Backend is a self-contained project; Render builds only backend/.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: commit
    plan: 0.5c-512mb
    buildFilter:
      paths:
        - backend/**
        - render.yaml

    envVars:
      # Accepts either the full jdbc:mysql://... URL or the short mysql://... URI
      # from Aiven; the app converts the short form at startup. Dashboard values
      # for DB_USERNAME / DB_PASSWORD take precedence over credentials in the URI,
      # and the truststore password comes from AIVEN_TRUSTSTORE_PASSWORD.
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: AIVEN_TRUSTSTORE_PASSWORD
        sync: false
      - key: RAILSAFE_SUPER_ADMIN_EMAIL
        sync: false
      - key: RAILSAFE_SUPER_ADMIN_PASSWORD
        sync: false

      # HTTPS behind Vercel's proxy; do not set RAILSAFE_SERVER_ADDRESS here.
      - key: RAILSAFE_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: RAILSAFE_COOKIE_SECURE
        value: "true"
      - key: RAILSAFE_HSTS_ENABLED
        value: "true"

      # Keep the labelled simulation behaviour used by the existing UI.
      - key: RAILSAFE_LIVE_MODE
        value: simulation
      - key: RAILSAFE_DEMO_ACCOUNTS_ENABLED
        value: "false"
      - key: RAILSAFE_DDL_AUTO
        value: update
